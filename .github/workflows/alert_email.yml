name: Inventory Alert Email

on:
  schedule:
    # Every Monday and Thursday at 8:17 AM UTC
    # NOTE: GitHub Actions delays/skips cron jobs scheduled on the hour due to
    # high load. Using off-hour minutes (e.g. 17) makes runs much more reliable.
    - cron: '17 8 * * 1'   # Monday
    - cron: '17 8 * * 4'   # Thursday
  workflow_dispatch:        # Allow manual trigger from GitHub Actions tab
    inputs:
      note:
        description: 'Optional banner at the top of the email (e.g. correction notice)'
        required: false
        type: string
        default: ''
      to:
        description: 'Override recipient(s) for this run (comma-separated). Blank = use default from secrets.'
        required: false
        type: string
        default: ''

jobs:
  send-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install supabase python-dotenv

      - name: Send alert email
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ github.event.inputs.to != '' && github.event.inputs.to || secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_NOTE: ${{ github.event.inputs.note }}
        run: |
          python -c "
          import sys, logging
          logging.basicConfig(level=logging.INFO)
          from backend.alerts import send_alert_email
          ok = send_alert_email()
          sys.exit(0 if ok else 1)
          "
